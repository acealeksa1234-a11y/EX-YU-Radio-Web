name: Verify EX-YU online statistics service
on:
  push:
    paths:
      - '.github/workflows/verify-online-service.yml'
      - 'online.js'
  workflow_dispatch:
jobs:
  check-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and live HTTP API
        env:
          URL: https://jjgkvncuixqmcyugcblj.supabase.co/functions/v1/radio-online
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqZ2t2bmN1aXhxbWN5dWdjYmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MjQ0NDQsImV4cCI6MjExMTIwMDQ0NH0.DOOOmJ_27zMLwds_JjV8jvXaRMgizjKARnIRlwYoM2w
        run: |
          set -euo pipefail
          node --check online.js
          node --check app.js
          node --check sw.js
          python3 - <<'PY'
          import json, urllib.request, os, uuid
          def call(sid):
              req=urllib.request.Request(os.environ['URL'],data=json.dumps({'session_id':sid}).encode(),headers={'Authorization':'Bearer '+os.environ['ANON'],'apikey':os.environ['ANON'],'Origin':'https://acealeksa1234-a11y.github.io','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert r.headers.get('Access-Control-Allow-Origin')=='https://acealeksa1234-a11y.github.io'
                  n=json.load(r)['online']
                  assert isinstance(n,int) and n>=0
                  return n
          base=call(None)
          a,b=str(uuid.uuid4()),str(uuid.uuid4())
          one,two,repeat,read=call(a),call(b),call(a),call(None)
          print('Counts:',base,one,two,repeat,read)
          assert one==base+1 and two==base+2 and repeat==two and read==two
          PY
